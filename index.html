        ...parsed,
        settings: {
          ...INITIAL_GAME_STATE.settings,
          ...parsed.settings || {}
        }
      };
    } catch (err) {
      console.warn("Failed to load saved state, using default:", err);
      return INITIAL_GAME_STATE;
    }
